<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Tabel</title>
    <style>
        table.styled, table.styled th, table.styled td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        table.styled th, table.styled td {
            padding: 2px 4px;
        }

        table.styled thead {
            background-color: gainsboro;
        }

        table.styled tfoot {
            background-color: greenyellow;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>No.</th>
            <th>Nama</th>
            <th>Hobi</th>
            <th>Pekerjaan</th>
        </tr>
        <tr>
            <td>1.</td>
            <td>Ahmad</td>
            <td>Bermain bulutangkis</td>
            <td>Koki</td>
        </tr>
        <tr>
            <td>2.</td>
            <td>Amin</td>
            <td>-</td>
            <td>-</td>
        </tr>
        <tr>
            <td>3.</td>
            <td>Melisa</td>
            <td>Membaca buku</td>
            <td>Pelayan</td>
        </tr>
    </table>
    <br>
    <table class="styled">
        <thead>
            <tr>
                <th colspan="3">Dokumen</th>
            </tr>
            <tr>
                <td>Nama</td>
                <td>Penanggung Jawab</td>
                <td>Status</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Perencanaan</td>
                <td rowspan="2">Yoga</td>
                <td>Terpenuhi</td>
            </tr>
            <tr>
                <td>Tabel Anggaran</td>
                <td>Terpenuhi</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Total: 2</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
